name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: TimeWidget.slnx
      Test_Project_Path: WindowsTimeWidget.Tests\WindowsTimeWidget.Tests.csproj
      Configuration: ${{ matrix.configuration }}
      Wap_Project_Directory: WindowsTimeWidget.Package
      Wap_Project_Path: WindowsTimeWidget.Package\WindowsTimeWidget.Package.wapproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        vs-prerelease: true
        vs-version: '[18.0,19.0)'
        msbuild-architecture: x64

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifiers=win-x86%3Bwin-x64
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build the application
      run: msbuild $env:Solution_Name /t:Build /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Execute unit tests
      run: msbuild $env:Test_Project_Path /t:VSTest /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Decode the pfx
      if: matrix.configuration == 'Release'
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Create the MSIX app package
      if: matrix.configuration == 'Release'
      run: >
        msbuild $env:Wap_Project_Path
        /p:Configuration=$env:Configuration
        /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode
        /p:AppxBundle=$env:Appx_Bundle
        /p:AppxBundlePlatforms=$env:Appx_Bundle_Platforms
        /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx
        /p:PackageCertificatePassword=${{ secrets.Pfx_Key }}
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x86|x64
        Appx_Package_Build_Mode: SideloadOnly
        Configuration: ${{ matrix.configuration }}

    - name: Remove the pfx
      if: matrix.configuration == 'Release'
      run: Remove-Item -Path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx

    - name: Upload MSIX artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package
        path: ${{ env.Wap_Project_Directory }}\AppPackages