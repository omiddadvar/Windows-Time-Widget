name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: TimeWidget.slnx
      Configuration: ${{ matrix.configuration }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore --configuration $env:Configuration

    - name: Test
      run: dotnet test $env:Solution_Name --no-build --configuration $env:Configuration --verbosity normal

    - name: Publish
      if: matrix.configuration == 'Release'
      run: >
        dotnet publish WindowsTimeWidget\WindowsTimeWidget.csproj
        --configuration Release
        --output .\publish

    - name: Upload artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTimeWidget-Release
        path: .\publish