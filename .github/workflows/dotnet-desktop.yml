name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: TimeWidget.slnx
      Test_Project_Path: WindowsTimeWidget.Tests\WindowsTimeWidget.Tests.csproj
      Configuration: ${{ matrix.configuration }}
      Wap_Project_Path: WindowsTimeWidget.Package\WindowsTimeWidget.Package.wapproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        vs-prerelease: true
        vs-version: '[18.0,19.0)'
        msbuild-architecture: x64
    
    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore --configuration $env:Configuration

    - name: Test
      run: dotnet test $env:Test_Project_Path --no-build --configuration $env:Configuration --verbosity normal

    - name: Build WAP project
      run: >
        msbuild $env:Wap_Project_Path
        /p:Configuration=$env:Configuration